<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel del Asesor — Robo-Advisor IA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      :root {
        --cobalt: #2563eb;
        --mint: #10b981;
        --ink: #020617;
        --pearl: #f8fafc;
        --danger: #dc2626;
        --warning: #d97706;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: var(--pearl);
        color: var(--ink);
        min-height: 100vh;
      }

      /* ── Header ── */
      .header {
        background: #fff;
        border-bottom: 1px solid rgba(148, 163, 184, 0.15);
        padding: 1.25rem 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .header-brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .header-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: #eff6ff;
        border-radius: 999px;
        padding: 0.45rem 0.9rem;
        font-size: 0.8rem;
        font-weight: 800;
        color: var(--cobalt);
      }

      .header h1 {
        font-size: 1.35rem;
        font-weight: 900;
        color: var(--ink);
      }

      .header-actions {
        display: flex;
        gap: 0.75rem;
        align-items: center;
      }

      .btn {
        border: 0;
        border-radius: 999px;
        cursor: pointer;
        font-family: inherit;
        font-weight: 800;
        padding: 0.65rem 1.2rem;
        font-size: 0.85rem;
        transition: transform 150ms ease, box-shadow 150ms ease;
      }

      .btn:hover { transform: translateY(-2px); }

      .btn-primary {
        background: linear-gradient(135deg, var(--cobalt), #1d4ed8);
        color: #fff;
        box-shadow: 0 12px 28px rgba(37, 99, 235, 0.25);
      }

      .btn-primary:hover { box-shadow: 0 18px 35px rgba(37, 99, 235, 0.32); }

      .btn-success {
        background: linear-gradient(135deg, #16a34a, #15803d);
        color: #fff;
        box-shadow: 0 10px 24px rgba(22, 163, 74, 0.25);
      }

      .btn-danger {
        background: linear-gradient(135deg, var(--danger), #b91c1c);
        color: #fff;
        box-shadow: 0 10px 24px rgba(220, 38, 38, 0.25);
      }

      .btn-warning {
        background: linear-gradient(135deg, #f59e0b, var(--warning));
        color: #fff;
        box-shadow: 0 10px 24px rgba(245, 158, 11, 0.2);
      }

      .btn-ghost {
        background: #f1f5f9;
        color: #475569;
        box-shadow: none;
      }

      .btn-sm { padding: 0.45rem 0.9rem; font-size: 0.8rem; }

      /* ── Main layout ── */
      .main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem 1.5rem 4rem;
      }

      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.75rem;
      }

      .section-title { font-size: 1.15rem; font-weight: 900; color: #0f172a; }
      .section-sub { font-size: 0.85rem; color: #64748b; margin-top: 0.2rem; }

      /* ── Stats bar ── */
      .stats-bar {
        display: flex;
        gap: 1rem;
        margin-bottom: 2rem;
        flex-wrap: wrap;
      }

      .stat-card {
        flex: 1;
        min-width: 130px;
        background: #fff;
        border-radius: 1.5rem;
        padding: 1rem 1.25rem;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      }

      .stat-number { font-size: 1.8rem; font-weight: 900; }
      .stat-label { font-size: 0.78rem; font-weight: 700; color: #64748b; margin-top: 0.2rem; }

      /* ── Cards grid ── */
      .cards-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(520px, 1fr));
        gap: 1.5rem;
      }

      .proposal-card {
        background: #fff;
        border-radius: 1.75rem;
        box-shadow: 0 12px 36px rgba(15, 23, 42, 0.07);
        overflow: hidden;
        transition: box-shadow 200ms ease;
      }

      .proposal-card:hover { box-shadow: 0 18px 48px rgba(15, 23, 42, 0.11); }

      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1.1rem 1.4rem;
        border-bottom: 1px solid rgba(148, 163, 184, 0.1);
      }

      .card-id { font-size: 0.8rem; font-weight: 800; color: #94a3b8; letter-spacing: 0.05em; }
      .card-date { font-size: 0.75rem; color: #94a3b8; }

      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        border-radius: 999px;
        padding: 0.35rem 0.85rem;
        font-size: 0.78rem;
        font-weight: 900;
      }

      .status-pendiente { background: #fef3c7; color: #92400e; }
      .status-aprobado  { background: #dcfce7; color: #14532d; }
      .status-rechazado { background: #fee2e2; color: #7f1d1d; }
      .status-editado   { background: #ede9fe; color: #4c1d95; }

      .card-body { padding: 1.25rem 1.4rem; }

      /* ── Perfil ── */
      .perfil-row {
        display: flex;
        align-items: baseline;
        gap: 0.75rem;
        margin-bottom: 0.75rem;
      }

      .perfil-badge {
        font-size: 1.1rem;
        font-weight: 900;
        color: var(--cobalt);
      }

      .perfil-score {
        font-size: 0.8rem;
        font-weight: 700;
        color: #94a3b8;
      }

      .info-block {
        background: var(--pearl);
        border-radius: 1.25rem;
        padding: 0.85rem 1rem;
        margin-bottom: 0.75rem;
        font-size: 0.85rem;
        color: #475569;
        line-height: 1.6;
      }

      .info-block strong {
        display: block;
        font-size: 0.72rem;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #94a3b8;
        margin-bottom: 0.3rem;
      }

      /* ── Mini chart ── */
      .mini-chart-wrap {
        display: grid;
        grid-template-columns: 120px 1fr;
        gap: 0.75rem;
        align-items: center;
        margin-bottom: 0.75rem;
      }

      .mini-chart-shell {
        height: 120px;
        display: grid;
        place-items: center;
      }

      .asset-mini-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        padding: 0.3rem 0;
        border-bottom: 1px solid rgba(148, 163, 184, 0.08);
        font-size: 0.8rem;
      }

      .asset-mini-dot {
        width: 0.6rem;
        height: 0.6rem;
        border-radius: 999px;
        flex-shrink: 0;
      }

      /* ── Acciones ── */
      .card-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        margin-top: 1rem;
        padding-top: 1rem;
        border-top: 1px solid rgba(148, 163, 184, 0.1);
      }

      /* ── Editar form ── */
      .edit-form {
        margin-top: 1rem;
        padding: 1rem;
        background: #f8fafc;
        border-radius: 1.25rem;
        border: 1px solid rgba(37, 99, 235, 0.15);
        display: none;
      }

      .edit-form.visible { display: block; }

      .edit-form label {
        display: block;
        font-size: 0.78rem;
        font-weight: 800;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 0.4rem;
        margin-top: 0.75rem;
      }

      .edit-form input,
      .edit-form textarea {
        width: 100%;
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 0.85rem;
        padding: 0.7rem 0.9rem;
        font-family: inherit;
        font-size: 0.85rem;
        color: var(--ink);
        background: #fff;
        outline: none;
        resize: vertical;
        transition: border-color 150ms ease;
      }

      .edit-form input:focus,
      .edit-form textarea:focus { border-color: var(--cobalt); }

      /* ── Audit log ── */
      .audit-log {
        margin-top: 0.75rem;
        background: #f0fdf4;
        border-radius: 1.25rem;
        padding: 0.85rem 1rem;
        font-size: 0.8rem;
        color: #166534;
      }

      .audit-log.rechazado { background: #fef2f2; color: #991b1b; }
      .audit-log.editado   { background: #f5f3ff; color: #4c1d95; }

      .audit-log strong {
        display: block;
        font-weight: 900;
        margin-bottom: 0.35rem;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      /* ── Alertas ── */
      .alertas-box {
        background: #fff7ed;
        border-radius: 1rem;
        padding: 0.75rem 1rem;
        margin-bottom: 0.75rem;
        font-size: 0.82rem;
        color: #9a3412;
      }

      /* ── Empty state ── */
      .empty-state {
        grid-column: 1 / -1;
        text-align: center;
        padding: 5rem 2rem;
      }

      .empty-icon {
        font-size: 3.5rem;
        margin-bottom: 1rem;
      }

      .empty-state h3 { font-size: 1.2rem; font-weight: 800; color: #0f172a; }
      .empty-state p { color: #64748b; margin-top: 0.5rem; font-size: 0.9rem; }

      /* ── Responsive ── */
      @media (max-width: 680px) {
        .cards-grid { grid-template-columns: 1fr; }
        .header { padding: 1rem; }
        .main { padding: 1.25rem 1rem 4rem; }
        .mini-chart-wrap { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <!-- ── Header ── -->
    <header class="header">
      <div class="header-brand">
        <div class="header-badge">
          <span style="width:0.6rem;height:0.6rem;border-radius:999px;background:#10b981;"></span>
          Asesor Autorizado
        </div>
        <h1>🛡️ Panel de Revisión</h1>
      </div>
      <div class="header-actions">
        <a href="/" style="text-decoration:none;">
          <button class="btn btn-ghost">← Ir a la app</button>
        </a>
        <button class="btn btn-primary" onclick="cargarPropuestas()">↻ Refrescar</button>
      </div>
    </header>

    <!-- ── Main ── -->
    <main class="main">
      <!-- Stats -->
      <div class="stats-bar" id="stats-bar">
        <div class="stat-card">
          <div class="stat-number" id="stat-total" style="color:#2563eb;">—</div>
          <div class="stat-label">Total propuestas</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="stat-pendiente" style="color:#d97706;">—</div>
          <div class="stat-label">Pendientes</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="stat-aprobado" style="color:#16a34a;">—</div>
          <div class="stat-label">Aprobadas</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="stat-rechazado" style="color:#dc2626;">—</div>
          <div class="stat-label">Rechazadas</div>
        </div>
      </div>

      <div class="section-header">
        <div>
          <p class="section-title">Propuestas generadas por IA</p>
          <p class="section-sub">Revisa, edita y aprueba antes de recomendar al cliente.</p>
        </div>
      </div>

      <div class="cards-grid" id="cards-grid">
        <div class="empty-state">
          <div class="orb-loading" style="width:3rem;height:3rem;border-radius:999px;background:conic-gradient(from 180deg,#2563eb,#10b981,#dbeafe,#2563eb);animation:spin 1.2s linear infinite;margin:0 auto 1rem;"></div>
          <p style="color:#64748b;">Cargando propuestas...</p>
        </div>
      </div>
    </main>

    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <script>
      // ── Cargar y renderizar propuestas desde la COLA FIFO ────────────────────────────────────
      async function cargarPropuestas() {
        try {
          const res = await fetch("/api/propuestas");
          if (!res.ok) throw new Error("Error al conectar con el servidor");
          
          const data = await res.json();
          renderStats(data);
          renderCards(data.propuestas || []);
        } catch (e) {
          document.getElementById("cards-grid").innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">⚠️</div>
              <h3>No se pudo conectar con el servidor</h3>
              <p>${e.message}</p>
            </div>`;
        }
      }

      function renderStats(data) {
        const propuestas = data.propuestas || [];
        const total = data.total || 0;
        const capacidadMaxima = data.capacidad_maxima || 5;
        const espaciosDisponibles = data.espacios_disponibles || 0;
        
        document.getElementById("stat-total").textContent = total;
        document.getElementById("stat-pendiente").textContent = total; // Todas son pendientes en la cola
        document.getElementById("stat-aprobado").textContent = 
          propuestas.filter((p) => p.estado === "aprobada").length;
        document.getElementById("stat-rechazado").textContent = 
          propuestas.filter((p) => p.estado === "rechazada").length;
        
        // Mostrar capacidad de la cola
        const statsBar = document.getElementById("stats-bar");
        const colaCard = document.getElementById("stat-cola");
        if (!colaCard) {
          const newCard = document.createElement("div");
          newCard.className = "stat-card";
          newCard.id = "stat-cola-card";
          newCard.innerHTML = `
            <div class="stat-number" id="stat-cola" style="color:#8b5cf6;">${espaciosDisponibles}</div>
            <div class="stat-label">Espacios en cola (/${capacidadMaxima})</div>
          `;
          statsBar.appendChild(newCard);
        } else {
          colaCard.textContent = espaciosDisponibles;
        }
      }

      function renderCards(propuestas) {
        const grid = document.getElementById("cards-grid");

        if (propuestas.length === 0) {
          grid.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">📭</div>
              <h3>Cola vacía</h3>
              <p>No hay propuestas pendientes de revisión. Cuando un cliente envíe una propuesta, aparecerá aquí automáticamente.</p>
              <div style="margin-top:1.5rem;padding:1rem;background:#f0fdf4;border-radius:1rem;max-width:400px;margin-left:auto;margin-right:auto;">
                <p style="font-size:0.85rem;color:#166534;">
                  ✅ Cola disponible: <strong>5/5 posiciones libres</strong>
                </p>
              </div>
              <a href="/" style="display:inline-block;margin-top:1.5rem;">
                <button class="btn btn-primary">Ir a la app del cliente →</button>
              </a>
            </div>`;
          return;
        }

        grid.innerHTML = propuestas
          .map((p) => buildCardHTML(p))
          .join("");

        // Montar mini-charts
        propuestas.forEach((p) => {
          mountMiniChart(p);
        });
      }

      function statusClass(estado) {
        if (estado === "pendiente" || estado === "Pendiente") return "status-pendiente";
        if (estado === "aprobada") return "status-aprobado";
        if (estado === "rechazada") return "status-rechazado";
        return "status-editado";
      }

      function statusIcon(estado) {
        if (estado === "pendiente" || estado === "Pendiente") return "⏳";
        if (estado === "aprobada") return "✅";
        if (estado === "rechazada") return "❌";
        return "✏️";
      }

      function buildCardHTML(p) {
        const d = p.datos || {};
        const posicionCola = p.posicion_cola || "—";

        // Asset rows mini
        const assetRows = (d.asignacion || [])
          .map(
            (a) => `
            <div class="asset-mini-row">
              <div style="display:flex;align-items:center;gap:0.4rem;">
                <span class="asset-mini-dot" style="background:${a.color}"></span>
                <span>${a.nombre}</span>
              </div>
              <strong>${a.porcentaje}%</strong>
            </div>`
          )
          .join("");

        // Alertas
        const alertasHTML =
          d.alertas && d.alertas.length > 0
            ? `<div class="alertas-box">⚠ ${d.alertas.join(" · ")}</div>`
            : "";

        return `
          <div class="proposal-card" id="card-${p.id}">
            <div class="card-header">
              <div>
                <div class="card-id">ID: ${p.id} · Posición en Cola: #${posicionCola}</div>
                <div class="card-date">${formatFecha(p.fecha_creacion)}</div>
              </div>
              <span class="status-badge ${statusClass(p.estado)}">
                ${statusIcon(p.estado)} Pendiente
              </span>
            </div>

            <div class="card-body">
              <!-- Perfil -->
              <div class="perfil-row">
                <span class="perfil-badge">${d.perfil || "—"}</span>
              </div>

              <!-- Meta del cliente -->
              <div class="info-block">
                <strong>Meta del cliente</strong>
                ${p.goal || p.meta_usuario || "—"}
              </div>

              <!-- Resumen para el asesor (del Agente Explicador) -->
              <div class="info-block">
                <strong>Resumen del Agente Explicador</strong>
                ${d.resumen_asesor || "—"}
              </div>

              ${alertasHTML}

              <!-- Mini chart + asignación -->
              <div class="mini-chart-wrap">
                <div class="mini-chart-shell">
                  <canvas id="chart-${p.id}" width="120" height="120"
                    aria-label="Distribución de activos" role="img"></canvas>
                </div>
                <div>${assetRows}</div>
              </div>

              <!-- Riesgo -->
              <div class="info-block" style="background:#f0fdf4;">
                <strong>Nivel de riesgo</strong>
                ${d.riesgo || "—"}
              </div>

              <!-- Justificación -->
              <div class="info-block">
                <strong>Justificación de la IA</strong>
                ${d.justificacion || "—"}
              </div>

              <!-- Disclaimer -->
              <div style="font-size:0.75rem;color:#94a3b8;margin-top:0.5rem;padding:0.5rem 0.75rem;background:#f8fafc;border-radius:0.75rem;">
                ⚖ ${d.disclaimer || ""}
              </div>

              <!-- Reglas usadas -->
              ${d.reglas_usadas && d.reglas_usadas.length > 0
                ? `<details style="margin-top:0.75rem;cursor:pointer;font-size:0.8rem;color:#64748b;">
                    <summary style="font-weight:700;">📋 Reglas de perfilamiento aplicadas</summary>
                    <ul style="margin-top:0.5rem;list-style:disc;padding-left:1.25rem;line-height:1.8;">
                      ${d.reglas_usadas.map((r) => `<li>${r}</li>`).join("")}
                    </ul>
                  </details>`
                : ""}

              <!-- Botones de acción FIFO -->
              <div class="card-actions">
                <button class="btn btn-success btn-sm" onclick="resolverPropuesta('${p.id}', 'aprobar')">
                  ✅ Aprobar
                </button>
                <button class="btn btn-danger btn-sm" onclick="resolverPropuesta('${p.id}', 'rechazar')">
                  ❌ Rechazar
                </button>
              </div>

              <!-- Formulario de nota (opcional) -->
              <div class="edit-form" id="nota-form-${p.id}">
                <label for="nota-${p.id}">Nota u observación (opcional)</label>
                <textarea id="nota-${p.id}" rows="2" 
                  placeholder="Agrega alguna observación..."></textarea>
              </div>
            </div>
          </div>`;
      }

      // ── Mini chart por card ────────────────────────────────────────────────
      const miniCharts = {};

      function mountMiniChart(p) {
        const d = p.datos || {};
        const canvas = document.getElementById(`chart-${p.id}`);
        if (!canvas || !d.asignacion) return;

        if (miniCharts[p.id]) {
          miniCharts[p.id].destroy();
        }

        miniCharts[p.id] = new Chart(canvas, {
          type: "doughnut",
          data: {
            labels: d.asignacion.map((a) => a.nombre),
            datasets: [{
              data: d.asignacion.map((a) => a.porcentaje),
              backgroundColor: d.asignacion.map((a) => a.color),
              borderWidth: 0,
              hoverOffset: 8,
            }],
          },
          options: {
            responsive: false,
            cutout: "65%",
            plugins: { legend: { display: false }, tooltip: { enabled: true } },
            animation: { duration: 700 },
          },
        });
      }

      // ── Resolver propuesta (aprobar/rechazar) y eliminar de la cola ───────
      async function resolverPropuesta(id, accion) {
        const card = document.getElementById(`card-${id}`);
        if (!card) return;

        // Obtener nota opcional
        const notaElement = document.getElementById(`nota-${id}`);
        const nota = notaElement ? notaElement.value.trim() : "";

        // Confirmar acción
        const accionTexto = accion === "aprobar" ? "aprobar" : "rechazar";
        if (!confirm(`¿Confirmas que deseas ${accionTexto} esta propuesta?`)) {
          return;
        }

        // Animación de carga
        card.style.opacity = "0.5";
        card.style.pointerEvents = "none";

        try {
          const res = await fetch(`/api/resolver_propuesta/${id}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ accion, nota }),
          });

          if (!res.ok) {
            const error = await res.json();
            throw new Error(error.error || "Error al resolver la propuesta");
          }

          const data = await res.json();

          // CRÍTICO: Eliminar dinámicamente la card del DOM
          card.style.transition = "all 400ms ease";
          card.style.transform = "scale(0.9)";
          card.style.opacity = "0";

          setTimeout(() => {
            card.remove();
            
            // Destruir chart si existe
            if (miniCharts[id]) {
              miniCharts[id].destroy();
              delete miniCharts[id];
            }

            // Mostrar toast de éxito
            mostrarToast(`✅ Propuesta ${accionTexto}da exitosamente`, "success");

            // Recargar stats y verificar si quedó vacía la cola
            cargarPropuestas();
          }, 400);

        } catch (e) {
          card.style.opacity = "1";
          card.style.pointerEvents = "auto";
          alert(`Error: ${e.message}`);
        }
      }

      // ── Toast notification ─────────────────────────────────────────────────
      function mostrarToast(mensaje, tipo = "success") {
        const existente = document.querySelector(".toast-notification");
        if (existente) existente.remove();

        const toast = document.createElement("div");
        toast.className = "toast-notification";
        toast.style.cssText = `
          position: fixed;
          bottom: 2rem;
          right: 2rem;
          background: ${tipo === "success" ? "#10b981" : "#dc2626"};
          color: white;
          padding: 1rem 1.5rem;
          border-radius: 1rem;
          box-shadow: 0 12px 32px rgba(0,0,0,0.2);
          font-weight: 700;
          font-size: 0.9rem;
          z-index: 9999;
          animation: slideInUp 300ms ease;
        `;
        toast.textContent = mensaje;
        document.body.appendChild(toast);

        setTimeout(() => {
          toast.style.animation = "slideOutDown 300ms ease";
          setTimeout(() => toast.remove(), 300);
        }, 3500);
      }

      // ── Utilidades ─────────────────────────────────────────────────────────
      function formatFecha(isoString) {
        if (!isoString) return "—";
        try {
          const date = new Date(isoString);
          const meses = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
          const dia = date.getDate();
          const mes = meses[date.getMonth()];
          const hora = date.getHours().toString().padStart(2, "0");
          const min = date.getMinutes().toString().padStart(2, "0");
          return `${dia} ${mes}, ${hora}:${min}`;
        } catch {
          return isoString;
        }
      }

      // ── Carga inicial ──────────────────────────────────────────────────────
      cargarPropuestas();

      // Auto-refresh cada 15 segundos
      setInterval(cargarPropuestas, 15000);
    </script>

    <style>
      @keyframes slideInUp {
        from { transform: translateY(100px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      @keyframes slideOutDown {
        from { transform: translateY(0); opacity: 1; }
        to { transform: translateY(100px); opacity: 0; }
      }
    </style>
  </body>
</html>
